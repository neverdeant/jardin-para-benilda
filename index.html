<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Un jardín para Benilda Ayala ❤️</title><style>*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:white;overflow:hidden;background:#17213d}.sky{position:fixed;inset:0;background:linear-gradient(#fba47e,#ed9eb3 48%,#375e5b);transition:background 5s}.sky.night{background:linear-gradient(#0b102d,#272a55 70%,#2d594d)}.sun,.moon{position:absolute;width:130px;height:130px;top:17%;left:calc(50% - 65px);border-radius:50%;background:#ffe6a7;box-shadow:0 0 100px #ffe4a7;transition:opacity 4s}.moon{left:75%;width:70px;height:70px;background:#fff8dd;opacity:0}.night .sun{opacity:0}.night .moon{opacity:1}.hill{position:absolute;bottom:-12%;left:-20%;width:140%;height:40%;border-radius:50% 50% 0 0;background:linear-gradient(#397d56,#173c32)}.flowers{position:absolute;inset:0;overflow:hidden}.flower{position:absolute;bottom:-30px;font-size:clamp(35px,6vw,80px);transform:translateY(200px);opacity:0;transition:transform 3s,opacity 3s;animation:sway 5s ease-in-out infinite alternate}.flower.show{transform:translateY(0);opacity:1}@keyframes sway{to{rotate:5deg}}.stars{position:absolute;inset:0;opacity:0;transition:opacity 4s}.night .stars{opacity:1}.star{position:absolute;background:white;width:3px;height:3px;border-radius:50%;animation:blink 2s infinite alternate}@keyframes blink{to{opacity:.2}}.screen{position:relative;z-index:2;height:100dvh;display:grid;place-items:center;text-align:center;padding:20px}.card{width:min(94vw,700px);padding:clamp(24px,5vw,48px);border-radius:28px;background:#16152c99;backdrop-filter:blur(12px);border:1px solid #ffffff55;box-shadow:0 20px 70px #0005;animation:fade 1.2s}@keyframes fade{from{opacity:0;translate:0 20px}to{opacity:1;translate:0 0}}h1{font-size:clamp(32px,7vw,58px);margin:12px 0}p{font-size:clamp(18px,3vw,25px);line-height:1.6}.label{font:12px Arial,sans-serif;letter-spacing:3px;text-transform:uppercase;color:#ffe6bf}button{border:0;border-radius:30px;background:#ffe2d9;color:#70304c;padding:15px 25px;margin:8px;font:bold 16px Arial;cursor:pointer}.secondary{background:#ffffff33;color:white;border:1px solid white}.letter{background:#fff4e6;color:#603c4a;text-align:left;padding:25px;border-radius:12px;max-height:58vh;overflow:auto}.letter p{font-size:clamp(15px,2.8vw,19px)}.bar{position:fixed;z-index:5;bottom:15px;left:5%;width:90%;height:6px;background:#ffffff66;border-radius:10px;overflow:hidden}.bar span{display:block;background:#ffe6a7;width:0;height:100%}.mute{position:fixed;z-index:6;top:12px;right:12px;padding:9px;font-size:13px}.hidden{display:none}.heart{position:fixed;z-index:4;bottom:0;animation:rise 4s linear forwards;font-size:30px}@keyframes rise{to{translate:0 -110vh;opacity:0}}</style></head><body><div id="sky" class="sky"><div class="sun"></div><div class="moon"></div><div class="stars" id="stars"></div><div class="hill"></div><div class="flowers" id="flowers"></div></div><main class="screen"><section class="card" id="card"><div class="label">De Victor Dante para Benilda Ayala</div><h1>Un jardín para ti 🌹</h1><p>Benilda, preparé una sorpresa muy especial. ¿Me acompañas a descubrirla?</p><button id="start">Comenzar nuestra historia ❤️</button><p style="font-size:14px">Una experiencia de 3 minutos y 30 segundos</p></section></main><button class="mute hidden" id="mute">🔊 Música</button><div class="bar hidden" id="progress"><span id="fill"></span></div><audio id="song" src="de-rodillas.mp3" preload="auto"></audio><script>const card=document.getElementById('card'),sky=document.getElementById('sky'),song=document.getElementById('song'),fill=document.getElementById('fill');let startTime,step=-1,finished=false;for(let i=0;i<24;i++){let e=document.createElement('div');e.className='flower';e.textContent=['🌹','🌻','🌷'][i%3];e.style.left=(i*41%100)+'%';e.style.bottom=(i*7%18-5)+'%';e.style.animationDelay=(i%6)+'s';document.getElementById('flowers').appendChild(e)}for(let i=0;i<65;i++){let e=document.createElement('i');e.className='star';e.style.left=(i*37%100)+'%';e.style.top=(i*17%67)+'%';e.style.animationDelay=(i%8)*.3+'s';document.getElementById('stars').appendChild(e)}const scenes=[{t:0,h:'Benilda Ayala ❤️',p:'Hoy quiero mostrarte algo que preparé especialmente para ti. Cada detalle de este pequeño jardín tiene un significado.'},{t:20,h:'Rosas para ti 🌹',p:'Cada rosa representa el cariño que ha ido creciendo en mi corazón.'},{t:40,h:'Girasoles de alegría 🌻',p:'Como los girasoles buscan la luz, tú has llenado de alegría muchos de mis días.'},{t:60,h:'Tulipanes especiales 🌷',p:'Hay personas que llegan a nuestra vida y ocupan un lugar muy especial. Tú eres una de ellas.'},{t:80,h:'Un ramo para Benilda 💐',p:'Reuní estas flores para ti porque cada una representa algo bonito que siento.'},{t:105,h:'Una carta para ti 💌',letter:true},{t:130,h:'Bajo las estrellas 🌙',p:'Hay algo que deseo contarte con calma, en esta noche tan especial.'},{t:150,h:'Benilda, quiero decirte algo ❤️',p:'Desde que llegaste a mi vida, hay un sentimiento bonito que no ha dejado de crecer.'},{t:165,h:'Me gustaría compartir contigo ✨',p:'Más momentos, más sonrisas y nuevas historias que podamos recordar con cariño.'},{t:180,h:'Una pregunta especial 🌹',p:'Hoy quiero preguntarte algo que nace desde lo más profundo de mi corazón.'},{t:195,h:'Benilda Ayala ❤️',question:true}];function render(s){let body='<div class="label">De Victor Dante, con cariño</div><h1>'+s.h+'</h1>';if(s.letter)body+='<div class="letter"><p><b>Para ti, Benilda Ayala ❤️</b></p><p>Desde que llegaste a mi vida, hay momentos que se han vuelto más bonitos y sonrisas que tienen un significado diferente.</p><p>Quise preparar este pequeño jardín para ti porque a veces las palabras no son suficientes para expresar todo lo que sentimos.</p><p>Cada rosa representa el cariño que ha nacido en mi corazón. Cada girasol representa la alegría que siento cuando pienso en ti. Y cada tulipán representa lo especial que eres para mí.</p><p>No sé qué nos tenga preparado el futuro, pero me gustaría compartir muchos momentos bonitos contigo, conocerte cada día más y construir una historia juntos.</p><p>Con todo mi cariño,<br><b>Victor Dante ❤️</b></p></div>';else if(s.question)body+='<h1>¿Quieres ser mi novia? 💖</h1><p>Tómate todo el tiempo que necesites.</p><button id="yes">Sí, quiero 💕</button><button class="secondary" id="later">Quiero pensarlo 🌷</button>';else body+='<p>'+s.p+'</p>';card.innerHTML=body;if(s.question){document.getElementById('yes').onclick=()=>reply(true);document.getElementById('later').onclick=()=>reply(false)}}function reply(yes){finished=true;card.innerHTML=yes?'<h1>¡Qué felicidad, Benilda! 💖</h1><p>Gracias por compartir este momento conmigo. Con todo mi cariño, Victor Dante. 🌹🌻🌷</p>':'<h1>Gracias, Benilda 🌷</h1><p>No hay prisa. Respeto lo que decidas y agradezco que hayas compartido este momento conmigo. Con cariño, Victor Dante.</p>';if(yes)for(let i=0;i<30;i++)setTimeout(()=>{let h=document.createElement('span');h.className='heart';h.style.left=(i*31%100)+'%';h.textContent=['💗','🌹','🌷'][i%3];document.body.appendChild(h);setTimeout(()=>h.remove(),4000)},i*130)}document.getElementById('start').onclick=async()=>{document.getElementById('progress').classList.remove('hidden');document.getElementById('mute').classList.remove('hidden');startTime=performance.now();try{await song.play()}catch(e){document.getElementById('mute').textContent='🔇 Sin archivo musical'}function frame(){if(finished)return;let t=Math.min(210,(performance.now()-startTime)/1000);if(!song.paused&&song.currentTime>0)t=Math.min(210,song.currentTime);let n=scenes.findLastIndex(s=>t>=s.t);if(n!==step){step=n;render(scenes[n]);document.querySelectorAll('.flower').forEach((f,i)=>{if(n>=4||i%3===Math.max(0,n-1)%3)f.classList.add('show')});if(n>=6)sky.classList.add('night')}fill.style.width=t/210*100+'%';if(t<210)requestAnimationFrame(frame)}requestAnimationFrame(frame)};document.getElementById('mute').onclick=()=>{song.muted=!song.muted;document.getElementById('mute').textContent=song.muted?'🔇 Silenciado':'🔊 Música'};</script></body></html>
