<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1b1734"><title>Un jardín para Benilda Ayala ❤️</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Georgia,'Times New Roman',serif;color:#fff}body{overflow:hidden;background:#1b1734}button{font:inherit;cursor:pointer}.scene{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#ffac89 0%,#f5a7aa 37%,#9d8ab8 67%,#374c63 100%);transition:background 5s}.scene.night{background:linear-gradient(180deg,#090d2d 0%,#24234b 56%,#42516a 100%)}.sun{position:absolute;left:50%;top:30%;width:170px;height:170px;border-radius:50%;background:#ffe2a5;box-shadow:0 0 95px 45px #ffdbab99;transform:translateX(-50%);transition:opacity 5s}.night .sun{opacity:0}.moon{position:absolute;right:13%;top:13%;width:95px;height:95px;border-radius:50%;background:#fff4d5;box-shadow:0 0 70px 22px #e9e5d477;opacity:0;transition:opacity 5s}.night .moon{opacity:1}.stars{position:absolute;inset:0;opacity:0;transition:opacity 4s}.night .stars{opacity:1}.star{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;animation:twinkle 2.5s infinite alternate}@keyframes twinkle{to{opacity:.2;transform:scale(.5)}}.hill{position:absolute;bottom:-12%;width:130%;height:40%;left:-15%;border-radius:50% 50% 0 0;background:linear-gradient(#3e7559,#183e38);box-shadow:0 -25px 60px #3e755955}.hill.back{bottom:-6%;left:15%;background:#54836c;height:30%;opacity:.8}.garden{position:absolute;inset:0;pointer-events:none}.flower{position:absolute;bottom:8%;width:100px;height:230px;transform-origin:bottom center;animation:sway 5s ease-in-out infinite alternate;filter:drop-shadow(0 8px 8px #0d1b2144)}@keyframes sway{to{transform:rotate(5deg)}}.stem{position:absolute;bottom:0;left:49%;height:76%;width:8px;background:linear-gradient(90deg,#19472d,#5ca566,#1c5836);border-radius:20px}.leaf{position:absolute;bottom:30%;left:48%;width:52px;height:25px;background:linear-gradient(135deg,#8dc979,#246a41);border-radius:100% 0 100% 0;transform:rotate(-24deg)}.leaf.two{left:7%;bottom:44%;transform:rotate(195deg)}.head{position:absolute;top:3%;left:10%;width:85px;height:85px}.petal{position:absolute;left:29px;top:3px;width:29px;height:53px;border-radius:70% 70% 45% 45%;transform-origin:50% 39px;background:radial-gradient(circle at 35% 30%,#ffb7bf,#bd254f 70%,#821b43);box-shadow:inset 0 0 8px #fff5}.flower.tulip .petal{background:linear-gradient(130deg,#ffe2e9,#d95486 55%,#9f2b60);width:34px;height:59px;border-radius:55% 55% 30% 30%}.flower.sunflower .petal{background:linear-gradient(120deg,#fff1a0,#ffc321 65%,#d88c0a);width:21px;height:52px;left:33px}.center{position:absolute;top:31px;left:30px;width:27px;height:27px;border-radius:50%;background:radial-gradient(circle,#6c3c24,#351e1a);box-shadow:inset 0 0 5px #0008}.flower.rose .center,.flower.tulip .center{background:radial-gradient(circle,#ff9caa,#9d1c4d)}.flower{opacity:0;transform:translateY(130px) scale(.65);transition:opacity 2.5s,transform 3s}.flower.bloom{opacity:1;transform:translateY(0) scale(1)}.flower.bloom{animation:sway 5s ease-in-out infinite alternate}.butterfly{position:absolute;font-size:26px;opacity:0;animation:float 11s linear infinite;transition:opacity 2s}.butterfly.show{opacity:.9}@keyframes float{0%{transform:translate(-10vw,65vh) rotate(-20deg)}50%{transform:translate(50vw,28vh) rotate(15deg)}100%{transform:translate(110vw,10vh) rotate(-10deg)}}.overlay{position:relative;z-index:4;display:flex;flex-direction:column;justify-content:center;align-items:center;min-height:100dvh;padding:24px;text-align:center;background:linear-gradient(180deg,#0b14200d,#0b14203d)}.card{width:min(94vw,690px);padding:clamp(22px,5vw,46px);border-radius:30px;background:#19162c80;backdrop-filter:blur(13px);border:1px solid #ffffff4a;box-shadow:0 15px 80px #13132655;animation:appear 1.2s ease both}@keyframes appear{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}h1{font-size:clamp(32px,7vw,60px);line-height:1.12;margin:8px 0 22px;text-shadow:0 4px 18px #21152b}p{font-size:clamp(18px,3.7vw,25px);line-height:1.65;margin:14px 0 25px}.eyebrow{letter-spacing:.2em;text-transform:uppercase;font:12px system-ui,sans-serif;color:#ffe4b6}.btn{border:0;border-radius:100px;padding:15px 25px;margin:7px;background:linear-gradient(120deg,#fff0d8,#f6b9ce);color:#532540;font-weight:bold;box-shadow:0 6px 25px #140d264d;transition:transform .2s}.btn:hover{transform:translateY(-3px)}.btn.secondary{background:#ffffff25;color:white;border:1px solid #ffffff80}.controls{position:fixed;z-index:8;left:14px;right:14px;bottom:15px;display:flex;align-items:center;gap:10px;font:13px system-ui,sans-serif}.progress{height:6px;background:#ffffff55;flex:1;border-radius:20px;overflow:hidden}.progress span{display:block;background:#ffe5ac;height:100%;width:0}.small{border:1px solid #ffffff70;background:#11182d88;color:white;padding:9px 12px;border-radius:20px}.hidden{display:none!important}.letter{background:#fff4df;color:#603b4a;border-radius:10px;padding:25px 20px;box-shadow:0 10px 40px #0005;max-height:55vh;overflow:auto;text-align:left}.letter p{font-size:clamp(16px,3vw,19px);line-height:1.65}.bouquet{font-size:clamp(55px,12vw,100px);filter:drop-shadow(0 8px 12px #0006);animation:appear 2s}.final h1{color:#fff0d4}.heart{position:absolute;pointer-events:none;animation:rise 5s linear forwards;font-size:24px}@keyframes rise{from{transform:translateY(30px);opacity:1}to{transform:translateY(-100vh) rotate(30deg);opacity:0}}.note{font:13px system-ui,sans-serif;opacity:.8}.response{font-size:clamp(19px,4vw,26px)}@media(max-height:650px){.card{padding:18px}.card p{margin:8px 0 15px}.flower{bottom:2%}}
</style></head><body><main id="scene" class="scene"><div class="sun"></div><div class="moon"></div><div class="stars" id="stars"></div><div class="hill back"></div><div class="hill"></div><div class="garden" id="garden"></div><div class="butterfly" id="butterfly">🦋</div></main><section class="overlay" id="overlay"><div class="card" id="content"><div class="eyebrow">Una sorpresa de Victor Dante</div><h1>Un jardín para Benilda Ayala 🌷</h1><p>Hay sentimientos que merecen florecer lentamente. Preparé algo muy especial para ti.</p><button class="btn" id="start">Comenzar nuestra historia ✨</button><p class="note">Duración: 3 minutos y 30 segundos · Activa el sonido si deseas escuchar la música</p></div></section><div class="controls hidden" id="controls"><button class="small" id="sound" aria-label="Activar o silenciar música">🔊 Música</button><div class="progress"><span id="bar"></span></div><span id="clock">0:00 / 3:30</span></div><audio id="audio" src="de-rodillas.mp3" preload="auto"></audio><script>
const DURATION=210, scene=document.getElementById('scene'),garden=document.getElementById('garden'),content=document.getElementById('content'),audio=document.getElementById('audio'),bar=document.getElementById('bar'),clock=document.getElementById('clock');let started=false,elapsed=0,last=-1,paused=false,timer,hasAudio=false,answered=false;const stages=[{at:0,title:'Benilda Ayala',text:'Hoy quiero regalarte algo que nace de mi corazón. Cada flor de este jardín tiene un significado especial para ti. 🌅'},{at:20,title:'Las rosas 🌹',text:'Cada rosa representa el cariño que ha ido creciendo en mí. Hay personas que hacen que los días se sientan diferentes… y tú eres una de ellas.'},{at:40,title:'Los girasoles 🌻',text:'Como los girasoles buscan la luz, tu presencia ha llenado de alegría muchos de mis días.'},{at:60,title:'Los tulipanes 🌷',text:'Los tulipanes guardan un mensaje sencillo: eres una persona muy especial para mí, Benilda.'},{at:80,title:'Un ramo para ti 💐',text:'Quise reunir rosas, girasoles y tulipanes para regalarte, aunque sea desde esta pequeña pantalla, algo hecho con mucho cariño.'},{at:105,title:'Una carta para Benilda 💌',letter:true},{at:130,title:'Bajo este cielo estrellado 🌙',text:'Cuando las estrellas aparecen, hay algo que quiero contarte con calma… algo que he guardado con mucho cariño.'},{at:150,title:'Hay algo que quiero decirte ❤️',text:'Benilda, desde que llegaste a mi vida, hay un sentimiento muy bonito que no ha dejado de crecer.'},{at:165,title:'Me haces sonreír ✨',text:'Me gustaría compartir contigo más momentos, más conversaciones y nuevas historias que podamos recordar con alegría.'},{at:180,title:'Desde mi corazón 🌹',text:'Por eso, hoy quiero hacerte una pregunta muy especial…'},{at:195,title:'Benilda Ayala ❤️',question:true}];
function makeFlowers(){let types=['rose','sunflower','tulip'];for(let i=0;i<23;i++){let f=document.createElement('div'),type=types[i%3];f.className='flower '+type;f.style.left=((i*47+11)%104-4)+'%';f.style.bottom=(3+(i*13)%13)+'%';f.style.zIndex=1+(i%4);f.style.scale=(.55+(i%5)*.14);f.style.animationDelay=(i%6)*-.6+'s';f.innerHTML='<div class="stem"></div><div class="leaf"></div><div class="leaf two"></div><div class="head">'+Array.from({length:type==='sunflower'?12:7},(_,j)=>`<div class="petal" style="transform:rotate(${j*360/(type==='sunflower'?12:7)}deg)"></div>`).join('')+'<div class="center"></div></div>';garden.appendChild(f)}}makeFlowers();for(let i=0;i<70;i++){let s=document.createElement('i');s.className='star';s.style.left=(i*37%100)+'%';s.style.top=(i*19%66)+'%';s.style.animationDelay=(i%9)*.3+'s';document.getElementById('stars').appendChild(s)}
function showStage(index){let s=stages[index];if(!s)return;document.querySelectorAll('.flower').forEach((f,i)=>{if(index>=4||index===0||i%3===Math.max(0,index-1)%3)f.classList.add('bloom')});if(index>=3)document.getElementById('butterfly').classList.add('show');if(index>=6)scene.classList.add('night');let inner=`<div class="eyebrow">Para Benilda · De Victor Dante</div><h1>${s.title}</h1>`;if(s.letter){inner+=`<div class="letter"><p><strong>Para ti, Benilda Ayala ❤️</strong></p><p>Desde que llegaste a mi vida, hay momentos que se han vuelto más bonitos y sonrisas que tienen un significado diferente.</p><p>Quise preparar este pequeño jardín para ti porque a veces las palabras no son suficientes para expresar todo lo que sentimos.</p><p>Cada rosa representa el cariño que ha nacido en mi corazón. Cada girasol, la alegría que siento cuando pienso en ti. Y cada tulipán, lo especial que eres para mí.</p><p>No sé qué nos tenga preparado el futuro, pero me gustaría compartir muchos momentos bonitos contigo, conocerte cada día más y construir una historia juntos.</p><p>Con todo mi cariño,<br><strong>Victor Dante ❤️</strong></p></div>`}else if(s.question){inner+=`<p>Hay una pregunta que quiero hacerte con todo mi cariño…</p><h1>¿Quieres ser mi novia? 💖</h1><button class="btn" id="yes">Sí, quiero 💕</button><button class="btn secondary" id="think">Quiero pensarlo 🌷</button><p class="note">Tómate todo el tiempo que necesites.</p>`}else{if(index===4)inner+='<div class="bouquet">💐</div>';inner+=`<p>${s.text}</p>`}content.innerHTML=inner;if(s.question){document.getElementById('yes').onclick=()=>respond(true);document.getElementById('think').onclick=()=>respond(false)}}
function respond(yes){answered=true;clearInterval(timer);content.innerHTML=yes?'<div class="eyebrow">Un nuevo comienzo</div><h1>¡Qué felicidad, Benilda! 💖</h1><p>Gracias por compartir este momento tan especial conmigo. Con todo mi cariño, Victor Dante. 🌹🌻🌷</p>':'<div class="eyebrow">Con cariño y respeto</div><h1>Gracias por llegar hasta aquí, Benilda 🌷</h1><p>No hay prisa. Lo más importante es que te sientas cómoda con lo que decidas. Con cariño, Victor Dante.</p>';if(yes){for(let i=0;i<36;i++)setTimeout(()=>{let e=document.createElement('span');e.className='heart';e.textContent=['❤️','🌸','💗','🌷'][i%4];e.style.left=(i*29%100)+'%';e.style.bottom='-30px';document.body.appendChild(e);setTimeout(()=>e.remove(),5100)},i*170)}}
function tick(){if(paused||answered)return;elapsed=Math.min(DURATION,elapsed+.25);let i=stages.findLastIndex(s=>elapsed>=s.at);if(i!==last){last=i;showStage(i)}bar.style.width=elapsed/DURATION*100+'%';clock.textContent=`${Math.floor(elapsed/60)}:${String(Math.floor(elapsed%60)).padStart(2,'0')} / 3:30`;if(elapsed>=DURATION)clearInterval(timer)}
document.getElementById('start').onclick=async()=>{if(started)return;started=true;document.getElementById('controls').classList.remove('hidden');try{await audio.play();hasAudio=true}catch(e){document.getElementById('sound').textContent='🔇 Añadir audio'}showStage(0);last=0;timer=setInterval(()=>{if(hasAudio&&!audio.paused&&Number.isFinite(audio.currentTime)&&audio.currentTime>0){elapsed=Math.min(DURATION,audio.currentTime);elapsed-=.25}tick()},250)};document.getElementById('sound').onclick=async()=>{if(!hasAudio){try{await audio.play();hasAudio=true;document.getElementById('sound').textContent='🔊 Música'}catch(e){alert('Para escuchar la canción, coloca un archivo autorizado llamado de-rodillas.mp3 junto a esta página.')}}else{audio.muted=!audio.muted;document.getElementById('sound').textContent=audio.muted?'🔇 Silenciado':'🔊 Música'}};
</script></body></html>
