<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#300c24"><title>Un jardín para Benilda Ayala ❤️</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:wght@400;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet"><style>
:root{--rose:#ff719e;--gold:#ffe0a2}*{box-sizing:border-box}body{margin:0;background:#170a1b;color:#fff;font-family:'Montserrat',sans-serif;overflow:hidden}.bg{position:fixed;inset:0;background-image:linear-gradient(180deg,#18061c55,#240b2088 45%,#120812bb),url('portada.jpg');background-position:center;background-size:cover;transition:background-image 1s;transform:scale(1.02)}.bg:after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,transparent 15%,#1607177c 90%)}.spark{position:fixed;inset:0;pointer-events:none;overflow:hidden}.spark i{position:absolute;width:4px;height:4px;border-radius:50%;background:#ffe9ba;box-shadow:0 0 15px #fff0ad;animation:glow 3s infinite alternate}.petal{position:absolute;top:-10%;font-size:23px;animation:fall linear infinite;opacity:.7}@keyframes glow{to{opacity:.1;transform:scale(.4)}}@keyframes fall{to{transform:translate(90px,115vh) rotate(400deg);opacity:0}}.stage{position:relative;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 18px 85px;text-align:center}.box{width:min(94vw,690px);max-height:calc(100dvh - 115px);overflow:auto;padding:clamp(24px,5vw,52px);border-radius:32px;background:linear-gradient(150deg,#381327a8,#130a20d0);border:1px solid #ffe1b36e;box-shadow:0 15px 80px #0008,0 0 45px #f7667b22;backdrop-filter:blur(9px);animation:enter .8s ease both}@keyframes enter{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}.label{font-size:11px;letter-spacing:.27em;color:#ffe0b5;text-transform:uppercase}.script{font-family:'Great Vibes',cursive;font-size:clamp(56px,10vw,100px);font-weight:400;line-height:1.03;color:#ffbad1;text-shadow:0 4px 30px #fa517e99;margin:14px 0}.title{font-family:'Playfair Display',serif;font-size:clamp(33px,6vw,57px);line-height:1.18;margin:14px 0 22px}.text{font-family:'Playfair Display',serif;font-size:clamp(19px,3.5vw,27px);line-height:1.6;margin:18px 0;color:#fff3eb}.btn{background:linear-gradient(120deg,#ff477b,#ff8a9b);border:0;border-radius:50px;padding:15px 28px;color:white;font:600 15px Montserrat,sans-serif;box-shadow:0 9px 30px #ed3e6888;cursor:pointer;margin:7px}.btn.alt{background:#ffffffec;color:#8c2c4c}.btn:hover{transform:translateY(-2px)}.mini{font-size:12px;color:#ffe5dd}.letter{background:#fff1db;color:#65324a;border-radius:7px;padding:25px;text-align:left;max-height:min(58vh,470px);overflow:auto;box-shadow:0 10px 35px #0005;transform:rotate(-1deg)}.letter h2{font:46px 'Great Vibes',cursive;color:#b82f56;margin:0}.letter p{font:clamp(16px,2.5vw,20px)/1.7 'Playfair Display',serif}.letter .sign{text-align:right;font-family:'Great Vibes',cursive;font-size:36px;color:#a72b54}.controls{position:fixed;bottom:0;left:0;right:0;z-index:8;padding:14px 20px 20px;display:flex;align-items:center;gap:12px;background:linear-gradient(transparent,#170a1cdd);font:12px Montserrat,sans-serif}.controls[hidden]{display:none}.track{flex:1;height:6px;border-radius:10px;background:#ffffff66;overflow:hidden}.track span{display:block;width:0;height:100%;background:linear-gradient(90deg,#ff75a0,#ffe1a5)}.icon{border:1px solid #ffffff99;border-radius:30px;background:#3a1c36bb;color:white;padding:10px 12px;font-size:13px;cursor:pointer}.choices{display:flex;justify-content:center;flex-wrap:wrap}.endmark{font-size:48px}.hide{display:none}.response{font-size:clamp(22px,4vw,30px)}@media(max-width:420px){.box{padding:25px 19px}.script{font-size:64px}.stage{padding:12px 12px 84px}.controls{gap:7px;padding:10px 12px 16px}.icon{padding:9px 8px}}
</style></head><body><div class="bg" id="bg"></div><div class="spark" id="spark"></div><main class="stage"><article class="box" id="box"><div class="label">De Victor Dante · Con mucho cariño</div><h1 class="script">Un jardín para Benilda</h1><p class="text">Hay sentimientos que merecen florecer. Preparé una sorpresa para ti. 🌹</p><button class="btn" id="start">Comenzar ✨</button><p class="mini">Activa el sonido para disfrutar la canción · 3:30 min</p></article></main><div class="controls" id="controls" hidden><button class="icon" id="mute">🔊 Música</button><div class="track"><span id="fill"></span></div><span id="clock">0:00 / 3:30</span></div><audio id="audio" src="de-rodillas.mp3" preload="auto"></audio><script>
const bg=document.getElementById('bg'),box=document.getElementById('box'),audio=document.getElementById('audio'),fill=document.getElementById('fill'),clock=document.getElementById('clock'),spark=document.getElementById('spark');let startAt=0,last=-1,finished=false,started=false;const scenes=[
{t:0,bg:'portada.jpg',script:'Benilda Ayala',text:'Hoy quiero regalarte un jardín hecho con mucho cariño. ✨'},
{t:12,bg:'rosas.jpg',script:'Tu sonrisa',text:'Tiene una forma muy bonita de iluminar mis días. 🌹'},
{t:24,bg:'girasoles.jpg',script:'Tu alegría',text:'Hace que todo a mi alrededor se sienta más especial. 🌻'},
{t:36,bg:'ramo.jpg',script:'Eres especial',text:'Admiro tu forma de ser y la ternura que compartes. 💐'},
{t:48,bg:'noche.jpg',script:'Cada momento',text:'Contigo se convierte en un recuerdo que quisiera guardar. ✨'},
{t:60,bg:'rosas.jpg',script:'Cada rosa',text:'Representa una razón más para sonreír al pensar en ti. ❤️'},
{t:72,bg:'girasoles.jpg',script:'Cada girasol',text:'Representa la luz y la alegría que me inspiras. 🌻'},
{t:84,bg:'ramo.jpg',script:'Cada tulipán',text:'Representa lo bonito de conocerte cada día más. 🌷'},
{t:96,bg:'noche.jpg',script:'Un deseo',text:'Quisiera compartir contigo más risas, sueños y aventuras. 💫'},
{t:108,bg:'ramo.jpg',script:'Mi querida Benilda',letter:true},
{t:153,bg:'noche.jpg',script:'Bajo estas estrellas',text:'Quiero decirte algo muy importante para mí. 🌙'},
{t:165,bg:'rosas.jpg',script:'Desde mi corazón',text:'Hay un sentimiento hermoso que ha ido creciendo por ti. ❤️'},
{t:177,bg:'ramo.jpg',script:'Una pregunta',text:'La guardé para este momento tan especial… 🌹'},
{t:189,bg:'portada.jpg',question:true}
];
function paint(s){bg.style.backgroundImage=`linear-gradient(180deg,#18061c66,#240b2088 45%,#120812c9),url('${s.bg}')`;let h='<div class="label">De Victor Dante para Benilda Ayala</div>';if(s.letter){h+='<h1 class="script">Una carta para ti</h1><div class="letter"><h2>Mi querida Benilda,</h2><p>Desde que llegaste a mi vida, los días tienen un brillo diferente. Tu sonrisa, tu alegría y tu forma de ser me inspiran a ser mejor.</p><p>Admiro tu corazón y la manera en que haces especiales hasta los momentos más sencillos. Cada flor de este jardín representa algo bonito que siento por ti.</p><p>Me gustaría seguir conociéndote, compartir nuevas historias, apoyarte y llenar de sonrisas nuestros días, siempre con respeto y cariño.</p><p>Gracias por ser tú, por cada conversación y por este momento tan especial.</p><p class="sign">Con todo mi cariño,<br>Victor Dante ❤️</p></div>'}else if(s.question){h+='<h1 class="script">Benilda Ayala</h1><h2 class="title">¿Quieres ser mi novia? 💖</h2><p class="text">Sea cual sea tu respuesta, quiero que sepas lo especial que eres para mí.</p><div class="choices"><button class="btn" id="yes">💗 Sí, quiero</button><button class="btn alt" id="think">Quiero pensarlo 🌷</button></div><p class="mini">Sin prisa, responde cuando te sientas lista.</p>'}else{h+=`<h1 class="script">${s.script}</h1><p class="text">${s.text}</p>`}box.style.animation='none';void box.offsetWidth;box.style.animation='enter .8s ease both';box.innerHTML=h;if(s.question){document.getElementById('yes').onclick=()=>answer(true);document.getElementById('think').onclick=()=>answer(false)}}
function answer(yes){finished=true;box.innerHTML=yes?'<div class="label">Un nuevo comienzo</div><h1 class="script">¡Qué felicidad, Benilda!</h1><p class="text response">Gracias por compartir este momento tan especial conmigo. ❤️</p><p class="text">Con todo mi cariño, Victor Dante. 🌹🌻🌷</p>':'<div class="label">Con cariño y respeto</div><h1 class="script">Gracias, Benilda</h1><p class="text response">Tómate el tiempo que necesites. Tu decisión siempre será respetada. 🌷</p><p class="mini">Con cariño, Victor Dante.</p>';if(yes)for(let i=0;i<25;i++)setTimeout(()=>petal(true),i*150)}
function petal(heart=false){let p=document.createElement('span');p.className='petal';p.textContent=heart?'💗':['🌹','🌸','✨','💗'][Math.floor(Math.random()*4)];p.style.left=Math.random()*100+'%';p.style.animationDuration=(7+Math.random()*7)+'s';spark.appendChild(p);setTimeout(()=>p.remove(),15000)}for(let i=0;i<45;i++){let s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.top=Math.random()*90+'%';s.style.animationDelay=Math.random()*4+'s';spark.appendChild(s)}setInterval(()=>{if(started)petal()},1700);
function run(){if(finished)return;const t=Math.min(210,Math.max(0,(performance.now()-startAt)/1000));const n=scenes.findLastIndex(s=>t>=s.t);if(n!==last){last=n;paint(scenes[n])}fill.style.width=(t/210*100)+'%';clock.textContent=Math.floor(t/60)+':'+String(Math.floor(t%60)).padStart(2,'0')+' / 3:30';requestAnimationFrame(run)}document.getElementById('start').onclick=async()=>{if(started)return;started=true;document.getElementById('controls').hidden=false;startAt=performance.now();try{await audio.play()}catch(e){document.getElementById('mute').textContent='🔇 Música bloqueada';}requestAnimationFrame(run)};document.getElementById('mute').onclick=async()=>{if(audio.paused){try{await audio.play();audio.muted=false}catch(e){alert('No se pudo iniciar el audio. Comprueba que de-rodillas.mp3 esté junto a index.html.')}}else audio.muted=!audio.muted;document.getElementById('mute').textContent=audio.muted?'🔇 Silenciado':'🔊 Música'};
</script></body></html>
